<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@600&family=Rubik:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <title>Document</title>
  <style>
    html,
    body {
      font-family: 'Manrope', sans-serif;
      height: 100%;
    }

    body {
      background: url("./img/shutterstock_1007304739.png") no-repeat center/cover;
    }



    .container {
      width: 1000px;
      height: 600px;
      position: absolute;
      margin: auto;
      top: 0px;
      bottom: 0;
      right: 0;
      left: 0;
    }

    .bigfish {
      border-radius: 50%;
      width: 500px;
      height: 500px;
      position: absolute;
      margin: auto;
      top: 0px;
      bottom: 0px;
      right: 0px;
      left: 0px;
      animation: circle 60s infinite linear forwards running;
    }

    .boat {
      width: 150px;
      height: 150px;
      background: rgba(255, 255, 0, 0);
      border-radius: 50%;
      position: absolute;
      margin: auto;
      top: 150px;
      bottom: 0px;
      right: 0px;
      left: -300px;
      filter: drop-shadow(-3px 50px 0px rgb(2, 5, 32))
    }

    #clock1 {
      width: 290px;
      height: 290px;
      border-radius: 50%;
      position: absolute;
      margin: auto;
      top: -230px;
      bottom: 0px;
      right: 0px;
      left: 0px;
    }


    #clock2 {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      position: absolute;
      margin: auto;
      top: 100px;
      bottom: 0px;
      right: -400px;
      left: 0px;
    }

    #clock3 {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      position: absolute;
      margin: auto;
      top: 0px;
      bottom: -310px;
      right: 0px;
      left: 0px;
    }

    #hour {
      width: 90px;
      height: 50px;
      border-radius: 5px;
      top: calc(50% - 5px);
      left: 50%;
      position: absolute;
      transform: rotate(0deg);
      transform-origin: left center;
    }

    #minute {
      width: 90px;
      height: 20px;
      border-radius: 5px;
      top: calc(50% - 5px);
      left: 50%;
      position: absolute;
      transform: rotate(0deg);
      transform-origin: left center;
    }

    #second {
      width: 48%;
      height: 10px;
      border-radius: 5px;
      top: calc(50% - 5px);
      left: 50%;
      position: absolute;
      transform: rotate(0deg);
      transform-origin: left center;
      transition: 1s;
      transition-timing-function: linear;
    }

    .fish-circle {
      width: 100%;
      position: absolute;
      left: 220px;
      top: -200px;
    }

    .hfish {
      width: 95%;
      position: absolute;
      top: 3px;
      right: -5px;

    }

    .mfish {
      width: 80%;
      position: absolute;
      top: 0px;
      right: -5px;
    }

    .sfish {
      width: 45%;
      position: absolute;
      top: -20px;
      right: 10px;
    }


    .bg {
      width: 75%;
      position: absolute;
      top: 120px;
      left: -150px;
      filter: drop-shadow(0 0 5px rgb(65, 84, 255))
    }

    .circle {
      animation: circle 25s infinite linear forwards running;
    }

    @keyframes circle {
      0% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(180deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .TimeFish {
      animation: TimeFish 2s infinite linear forwards running;

    }

    @keyframes TimeFish {
      50% {
        transform: translateX(5px);
      }
    }

    .ShowBox {
      color: white;
      font-size: 30px;
      position: absolute;
      z-index: 2;
      filter: drop-shadow(0px 4px 0px rgb(2, 5, 32))
    }

    #showbox1 {
      top: 170px;
      left: 480px;
      color: rgb(239, 126, 0);
    }

    #showbox2 {
      top: 330px;
      right: 280px;
      color: rgb(0, 132, 189);
    }

    #showbox3 {
      bottom: 120px;
      left: 485px;
      color: rgb(209, 82, 82);
    }
  </style>
</head>

<body onload="ShowTime()">
  <div class="container">
    <div class="ShowBox" id="showbox1"></div>
    <div class="ShowBox" id="showbox2"></div>
    <div class="ShowBox" id="showbox3"></div>
    <div class="bigfish">
      <img src="./img/bg-fish3.svg" class="bg">
      <div id="TimeFont"></div>
    </div>
    <div class="boat">
      <img src="./img/boat.svg">
    </div>
    <div id="clock1">
      <img src="./img/fish-cercle3.svg" class="fish-circle1 circle">
      <div id="hour">
        <img src="./img/fish-hour.svg" class="hfish TimeFish">
      </div>
    </div>
    <div id="clock2">
      <img src="./img/fish-cercle3.svg" class="fish-circle1 circle">
      <div id="minute">
        <img src="./img/fish-minute.svg" class="mfish TimeFish">
      </div>
    </div>
    <div id="clock3">
      <img src="./img/fish-cercle3.svg" class="fish-circle1 circle">
      <div id="second">
        <img src="./img/fish-second.svg" class="sfish">
      </div>
    </div>
  </div>
  <script>
    const hour = document.getElementById("hour")
    const minute = document.getElementById("minute")
    const second = document.getElementById("second")
    const showbox1 = document.getElementById("showbox1")
    const showbox2 = document.getElementById("showbox2")
    const showbox3 = document.getElementById("showbox3")

    // 新增變數來記錄累積的圈數（避免倒退嚕）
    let totalSeconds = 0;
    let isFirstLoad = true;

    const updateClock = () => {
      const now = new Date()
      const h = now.getHours()
      const m = now.getMinutes()
      const s = now.getSeconds()

      // 數字顯示依然保持正常的時、分、秒
      showbox1.innerHTML = h
      showbox2.innerHTML = m
      showbox3.innerHTML = s

      // 計算時鐘正確的角度位置
      const hDeg = 30 * h - 90
      const mDeg = 6 * m - 90
      const sDeg = 6 * s - 90

      if (isFirstLoad) {
        // 第一次載入時，直接設定到當前時間的角度
        hour.style.transform = `rotate(${hDeg}deg)`
        minute.style.transform = `rotate(${mDeg}deg)`
        second.style.transform = `rotate(${sDeg}deg)`

        // 算出目前時間點，相對於 0 點 0 分 0 秒總共過了幾秒
        totalSeconds = (h * 3600) + (m * 60) + s;
        isFirstLoad = false;
      } else {
        // 之後每秒累加 1 秒鐘的權重（1秒 = 6度）
        totalSeconds++;

        // 透過累加的總秒數來計算角度，使其只會增加、不會減少
        const currentSRotate = totalSeconds * 6 - 90;

        // 分針與時針也可以用同樣邏輯優化，或者維持原樣（因為分針時針一小時/一天才倒退一次，較不明顯）
        // 這裡將秒針改為絕對累加
        second.style.transform = `rotate(${currentSRotate}deg)`
        hour.style.transform = `rotate(${hDeg}deg)`
        minute.style.transform = `rotate(${mDeg}deg)`
      }
    }

    updateClock()
    setInterval(updateClock, 1000)
  </script>
</body>

</html>
